                                <option value="hazardous">Hazardous</option>
                                <option value="organic">Organic</option>
                                <option value="electronic">Electronic</option>
                                <option value="general">General</option>
                            </select>
                            <select id="reportStatusFilter" class="form-control filter-select" onchange="filterReports()">
                                <option value="">All Status</option>
                                <option value="pending">Pending</option>
                                <option value="in-progress">In Progress</option>
                                <option value="resolved">Resolved</option>
                            </select>
                            ${this.currentUser.role === 'resident' ? `
                            <button class="btn btn-primary" onclick="openReportModal()">
                                <i class="fas fa-plus"></i> New Report
                            </button>
                            ` : ''}
                        </div>
                        
                        <div class="reports-grid" id="reportsGrid">
                            ${reports.map(report => `
                                <div class="report-card">
                                    <div class="report-header">
                                        <span class="report-type type-${report.type}">${report.type}</span>
                                        <span class="badge badge-${report.status}">${report.status}</span>
                                    </div>
                                    <div class="report-body">
                                        <h3 class="report-title">${report.title}</h3>
                                        <p class="report-description">${report.description.substring(0, 150)}...</p>
                                        <div style="display: flex; align-items: center; gap: 8px; color: #777; font-size: 0.9rem; margin-top: 10px;">
                                            <i class="fas fa-map-marker-alt"></i>
                                            <span>${report.location}</span>
                                        </div>
                                        <div style="margin-top: 15px; display: flex; align-items: center; gap: 10px;">
                                            <span class="badge" style="background: ${report.priority === 'critical' ? 'var(--danger)' : 
                                                report.priority === 'high' ? 'var(--warning)' : 
                                                report.priority === 'medium' ? 'var(--info)' : 'var(--gray)'}; color: white;">
                                                ${report.priority}
                                            </span>
                                            <span style="font-size: 0.9rem; color: var(--gray);">
                                                <i class="fas fa-calendar"></i> ${report.date}
                                            </span>
                                        </div>
                                    </div>
                                    <div class="report-footer">
                                        <div class="report-author">
                                            <div class="author-avatar" style="background: ${getUserColor(report.authorId)};">
                                                ${report.authorName.charAt(0)}
                                            </div>
                                            <div>
                                                <div><strong>${report.authorName}</strong></div>
                                                <div>Reported by</div>
                                            </div>
                                        </div>
                                        <div class="report-actions">
                                            <button class="btn btn-sm btn-info" onclick="viewReportDetails(${report.id})" title="View Details">
                                                <i class="fas fa-eye"></i>
                                            </button>
                                            <button class="btn btn-sm btn-success" onclick="openCommentModal(${report.id})" title="Comments">
                                                <i class="fas fa-comment"></i> ${report.comments}
                                            </button>
                                            <button class="btn btn-sm" onclick="upvoteReport(${report.id})" title="Upvote">
                                                <i class="fas fa-thumbs-up"></i> ${report.upvotes}
                                            </button>
                                            ${(this.currentUser.role === 'admin' || this.currentUser.role === 'staff') ? `
                                            ${report.status === 'pending' ? `
                                            <button class="btn btn-sm btn-warning" onclick="updateReportStatus(${report.id}, 'in-progress')" title="Start Working">
                                                <i class="fas fa-play"></i>
                                            </button>
                                            ` : ''}
                                            ${report.status === 'in-progress' ? `
                                            <button class="btn btn-sm btn-success" onclick="updateReportStatus(${report.id}, 'resolved')" title="Mark Resolved">
                                                <i class="fas fa-check"></i>
                                            </button>
                                            ` : ''}
                                            ` : ''}
                                            ${this.currentUser.role === 'admin' ? `
                                            <button class="btn btn-sm btn-danger" onclick="deleteReport(${report.id})" title="Delete">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                            ` : ''}
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            loadMyReports() {
                const content = document.getElementById('content');
                const reports = Database.getReports().filter(r => r.authorId === this.currentUser.id);
                
                content.innerHTML = `
                    <div class="animate__animated animate__fadeIn">
                        <div class="content-header">
                            <h1><i class="fas fa-file-alt"></i> My Reports</h1>
                            <p>View and manage your submitted waste reports</p>
                        </div>
                        
                        ${reports.length === 0 ? `
                        <div class="card">
                            <div class="empty-state">
                                <i class="fas fa-inbox"></i>
                                <h3>No Reports Yet</h3>
                                <p>You haven't submitted any waste reports yet.</p>
                                <button class="btn btn-primary" onclick="openReportModal()" style="margin-top: 20px;">
                                    <i class="fas fa-plus"></i> Submit Your First Report
                                </button>
                            </div>
                        </div>
                        ` : `
                        <div class="reports-grid">
                            ${reports.map(report => `
                                <div class="report-card">
                                    <div class="report-header">
                                        <span class="report-type type-${report.type}">${report.type}</span>
                                        <span class="badge badge-${report.status}">${report.status}</span>
                                    </div>
                                    <div class="report-body">
                                        <h3 class="report-title">${report.title}</h3>
                                        <p class="report-description">${report.description}</p>
                                        <div style="display: flex; align-items: center; gap: 8px; color: #777; font-size: 0.9rem; margin-top: 10px;">
                                            <i class="fas fa-map-marker-alt"></i>
                                            <span>${report.location}</span>
                                        </div>
                                    </div>
                                    <div class="report-footer">
                                        <div style="color: var(--gray); font-size: 0.9rem;">
                                            <i class="fas fa-calendar"></i> ${report.date}
                                        </div>
                                        <div class="report-actions">
                                            <button class="btn btn-sm btn-info" onclick="viewReportDetails(${report.id})">
                                                <i class="fas fa-eye"></i> Details
                                            </button>
                                            <button class="btn btn-sm btn-success" onclick="openCommentModal(${report.id})">
                                                <i class="fas fa-comment"></i> ${report.comments}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        `}
                    </div>
                `;
            }

            loadUsers() {
                if (this.currentUser.role !== 'admin') return;
                
                const content = document.getElementById('content');
                const users = Database.getUsers();
                
                content.innerHTML = `
                    <div class="animate__animated animate__fadeIn">
                        <div class="content-header">
                            <h1><i class="fas fa-users"></i> User Management</h1>
                            <p>Manage system users and their permissions</p>
                        </div>
                        
                        <div class="card">
                            <div class="card-header">
                                <h2 class="card-title"><i class="fas fa-user-friends"></i> All Users</h2>
                                <span style="color: var(--gray);">${users.length} users</span>
                            </div>
                            <div class="table-responsive">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Name</th>
                                            <th>Email</th>
                                            <th>Role</th>
                                            <th>Joined</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${users.map(user => `
                                            <tr>
                                                <td>${user.id}</td>
                                                <td>
                                                    <div style="display: flex; align-items: center; gap: 10px;">
                                                        <div style="width: 36px; height: 36px; border-radius: 50%; background: ${user.avatarColor}; 
                                                            display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;">
                                                            ${user.fullName.charAt(0)}
                                                        </div>
                                                        ${user.fullName}
                                                    </div>
                                                </td>
                                                <td>${user.email}</td>
                                                <td>
                                                    <span class="badge" style="background: ${getRoleColor(user.role)}; color: white;">
                                                        ${user.role}
                                                    </span>
                                                </td>
                                                <td>${new Date(user.joinDate).toLocaleDateString()}</td>
                                                <td>
                                                    <div class="action-buttons">
                                                        ${user.id !== this.currentUser.id ? `
                                                        <button class="btn btn-sm btn-danger" onclick="deleteUser(${user.id})">
                                                            <i class="fas fa-trash"></i> Delete
                                                        </button>
                                                        ` : `
                                                        <span style="color: var(--gray); font-size: 0.9rem;">Current User</span>
                                                        `}
                                                    </div>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // ==================== HELPER FUNCTIONS ====================
        function getRoleColor(role) {
            switch(role) {
                case 'admin': return '#c01c28';
                case 'staff': return '#1a5fb4';
                case 'resident': return '#26a269';
                default: return '#9a9996';
            }
        }

        function getUserColor(userId) {
            const users = Database.getUsers();
            const user = users.find(u => u.id === userId);
            return user ? user.avatarColor : '#9a9996';
        }

        function showToast(title, message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toastTitle');
            const toastMessage = document.getElementById('toastMessage');
            
            toastTitle.textContent = title;
            toastMessage.textContent = message;
            toast.className = `toast toast-${type}`;
            
            const icon = toast.querySelector('i');
            icon.className = type === 'success' ? 'fas fa-check-circle' : 
                            type === 'error' ? 'fas fa-exclamation-circle' : 
                            'fas fa-info-circle';
            
            toast.style.display = 'flex';
            setTimeout(() => toast.classList.add('show'), 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.style.display = 'none', 500);
            }, 3000);
        }

        function closeModal() {
            document.querySelectorAll('.modal').forEach(modal => {
                modal.style.display = 'none';
            });
        }

        function openReportModal() {
            document.getElementById('reportModal').style.display = 'flex';
        }

        function openCommentModal(reportId = null) {
            if (reportId) {
                state.currentReportId = reportId;
                loadComments(reportId);
            }
            document.getElementById('commentModal').style.display = 'flex';
        }

        function viewReportDetails(reportId) {
            const reports = Database.getReports();
            const report = reports.find(r => r.id === reportId);
            
            if (!report) {
                showToast('Error', 'Report not found', 'error');
                return;
            }

            const users = Database.getUsers();
            const author = users.find(u => u.id === report.authorId);
            
            document.getElementById('reportDetailsContent').innerHTML = `
                <div class="report-details">
                    <h4 style="margin-bottom: 15px; color: var(--dark);">
                        <i class="fas fa-info-circle"></i> Report Information
                    </h4>
                    
                    <div style="margin-bottom: 25px;">
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                            <span class="report-type type-${report.type}" style="font-size: 14px;">
                                ${report.type.toUpperCase()}
                            </span>
                            <span class="badge badge-${report.status}" style="font-size: 14px;">
                                ${report.status.toUpperCase()}
                            </span>
                            <span class="badge" style="background: ${report.priority === 'critical' ? 'var(--danger)' : 
                                report.priority === 'high' ? 'var(--warning)' : 
                                report.priority === 'medium' ? 'var(--info)' : 'var(--gray)'}; color: white; font-size: 14px;">
                                ${report.priority.toUpperCase()}
                            </span>
                        </div>
                        
                        <h3 style="margin-bottom: 15px; color: var(--dark);">${report.title}</h3>
                        
                        <div style="background: var(--light); padding: 20px; border-radius: 12px; margin-bottom: 20px;">
                            <h5 style="margin-bottom: 10px; color: var(--gray);">
                                <i class="fas fa-map-marker-alt"></i> Location
                            </h5>
                            <p style="font-size: 1.1rem;">${report.location}</p>
                        </div>
                        
                        <div style="background: var(--light); padding: 20px; border-radius: 12px; margin-bottom: 20px;">
                            <h5 style="margin-bottom: 10px; color: var(--gray);">
                                <i class="fas fa-file-alt"></i> Description
                            </h5>
                            <p>${report.description}</p>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px;">
                            <div style="background: var(--light); padding: 15px; border-radius: 12px;">
                                <h5 style="margin-bottom: 5px; color: var(--gray); font-size: 0.9rem;">
                                    <i class="fas fa-user"></i> Reported By
                                </h5>
                                <p style="font-weight: 600;">${report.authorName}</p>
                            </div>
                            <div style="background: var(--light); padding: 15px; border-radius: 12px;">
                                <h5 style="margin-bottom: 5px; color: var(--gray); font-size: 0.9rem;">
                                    <i class="fas fa-calendar"></i> Date Reported
                                </h5>
                                <p style="font-weight: 600;">${report.date}</p>
                            </div>
                        </div>
                        
                        <div style="display: flex; gap: 15px; margin-top: 20px;">
                            <div style="text-align: center; padding: 15px; background: var(--light); border-radius: 12px; flex: 1;">
                                <div style="font-size: 1.5rem; font-weight: bold; color: var(--primary);">${report.upvotes}</div>
                                <div style="color: var(--gray); font-size: 0.9rem;">Upvotes</div>
                            </div>
                            <div style="text-align: center; padding: 15px; background: var(--light); border-radius: 12px; flex: 1;">
                                <div style="font-size: 1.5rem; font-weight: bold; color: var(--info);">${report.comments}</div>
                                <div style="color: var(--gray); font-size: 0.9rem;">Comments</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('reportDetailsModal').style.display = 'flex';
        }

        // ==================== AUTH FUNCTIONS ====================
        function showLoginForm() {
            document.getElementById('loginCard').style.display = 'block';
            document.getElementById('registerCard').style.display = 'none';
        }

        function showRegisterForm() {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('registerCard').style.display = 'block';
        }

        function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showToast('Error', 'Please enter email and password', 'error');
                return;
            }
            
            const users = Database.getUsers();
            const user = users.find(u => u.email === email && u.password === password);
            
            if (user) {
                // Remove password before storing
                const { password, ...userWithoutPassword } = user;
                Database.setCurrentUser(userWithoutPassword);
                state.currentUser = userWithoutPassword;
                state.init();
                showToast('Success', 'Login successful!', 'success');
            } else {
                showToast('Error', 'Invalid email or password', 'error');
            }
        }

        function register() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;
            
            if (!name || !email || !password) {
                showToast('Error', 'Please fill in all fields', 'error');
                return;
            }
            
            if (password.length < 6) {
                showToast('Error', 'Password must be at least 6 characters', 'error');
                return;
            }
            
            const users = Database.getUsers();
            
            // Check if email already exists
            if (users.some(u => u.email === email)) {
                showToast('Error', 'Email already registered', 'error');
                return;
            }
            
            // Generate random avatar color
            const colors = ['#1a5fb4', '#26a269', '#e5a50a', '#c01c28', '#9141ac', '#1c71d8'];
            const avatarColor = colors[Math.floor(Math.random() * colors.length)];
            
            // Create new user
            const newUser = {
                id: users.length > 0 ? Math.max(...users.map(u => u.id)) + 1 : 1,
                fullName: name,
                email: email,
                password: password,
                role: role,
                avatarColor: avatarColor,
                joinDate: new Date().toISOString()
            };
            
            users.push(newUser);
            Database.saveUsers(users);
            
            // Auto-login after registration
            const { password: _, ...userWithoutPassword } = newUser;
            Database.setCurrentUser(userWithoutPassword);
            state.currentUser = userWithoutPassword;
            state.init();
            
            showToast('Success', 'Registration successful!', 'success');
        }

        function logout() {
            Database.clearCurrentUser();
            state.currentUser = null;
            state.init();
            showToast('Success', 'Logged out successfully', 'success');
        }

        // ==================== REPORT FUNCTIONS ====================
        function submitReport() {
            const title = document.getElementById('reportTitle').value.trim();
            const type = document.getElementById('reportType').value;
            const location = document.getElementById('reportLocation').value.trim();
            const description = document.getElementById('reportDescription').value.trim();
            const priority = document.getElementById('reportPriority').value;
            
            if (!title || !type || !location || !description) {
                showToast('Error', 'Please fill in all required fields', 'error');
                return;
            }
            
            const reports = Database.getReports();
            const newReport = {
                id: reports.length > 0 ? Math.max(...reports.map(r => r.id)) + 1 : 1,
                title: title,
                description: description,
                type: type,
                location: location,
                authorId: state.currentUser.id,
                authorName: state.currentUser.fullName,
                status: 'pending',
                priority: priority,
                date: new Date().toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                }),
                upvotes: 0,
                comments: 0
            };
            
            reports.unshift(newReport);
            Database.saveReports(reports);
            
            // Clear form
            document.getElementById('reportForm').reset();
            closeModal();
            
            // Reload content
            state.loadDashboard();
            
            showToast('Success', 'Report submitted successfully!', 'success');
        }

        function upvoteReport(reportId) {
            const reports = Database.getReports();
            const reportIndex = reports.findIndex(r => r.id === reportId);
            
            if (reportIndex !== -1) {
                reports[reportIndex].upvotes += 1;
                Database.saveReports(reports);
                
                // Update UI
                if (state.currentUser) {
                    state.loadAllReports();
                }
                
                showToast('Success', 'Report upvoted!', 'success');
            }
        }

        function updateReportStatus(reportId, status) {
            if (!confirm(`Are you sure you want to change this report status to "${status}"?`)) {
                return;
            }
            
            const reports = Database.getReports();
            const reportIndex = reports.findIndex(r => r.id === reportId);
            
            if (reportIndex !== -1) {
                reports[reportIndex].status = status;
                Database.saveReports(reports);
                
                // Update UI
                if (state.currentUser) {
                    state.loadAllReports();
                }
                
                showToast('Success', `Report marked as ${status}`, 'success');
            }
        }

        function deleteReport(reportId) {
            if (!confirm('Are you sure you want to delete this report?')) {
                return;
            }
            
            const reports = Database.getReports();
            const filteredReports = reports.filter(r => r.id !== reportId);
            
            // Also delete associated comments
            const comments = Database.getComments();
            const filteredComments = comments.filter(c => c.reportId !== reportId);
            
            Database.saveReports(filteredReports);
            Database.saveComments(filteredComments);
            
            // Update UI
            if (state.currentUser) {
                state.loadAllReports();
            }
            
            showToast('Success', 'Report deleted successfully', 'success');
        }

        // ==================== COMMENT FUNCTIONS ====================
        function loadComments(reportId) {
            const comments = Database.getComments().filter(c => c.reportId === reportId);
            const commentList = document.getElementById('commentList');
            
            if (comments.length === 0) {
                commentList.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--gray);">
                        <i class="fas fa-comment-slash" style="font-size: 3rem; margin-bottom: 15px;"></i>
                        <h4>No comments yet</h4>
                        <p>Be the first to comment on this report</p>
                    </div>
                `;
                return;
            }
            
            // Sort by timestamp (newest first)
            comments.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            commentList.innerHTML = comments.map(comment => `
                <div class="comment-card">
                    <div class="comment-header">
                        <div class="comment-author">
                            <div class="comment-avatar" style="background: ${getUserColor(comment.userId)};">
                                ${comment.userName.charAt(0)}
                            </div>
                            <div>
                                <div style="font-weight: 600;">${comment.userName}</div>
                                <div class="comment-time">${new Date(comment.timestamp).toLocaleString()}</div>
                            </div>
                        </div>
                        <div class="comment-actions">
                            <button class="btn btn-sm" onclick="likeComment(${comment.id})">
                                <i class="fas fa-thumbs-up"></i> ${comment.likes}
                            </button>
                            ${comment.userId === state.currentUser.id ? `
                            <button class="btn btn-sm btn-danger" onclick="deleteComment(${comment.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                            ` : ''}
                        </div>
                    </div>
                    <div class="comment-content">
                        ${comment.content}
                    </div>
                </div>
            `).join('');
        }

        function addComment() {
            const commentText = document.getElementById('commentText').value.trim();
            
            if (!commentText) {
                showToast('Error', 'Please enter a comment', 'error');
                return;
            }
            
            if (!state.currentReportId) {
                showToast('Error', 'No report selected', 'error');
                return;
            }
            
            const comments = Database.getComments();
            const reports = Database.getReports();
            
            // Add new comment
            const newComment = {
                id: comments.length > 0 ? Math.max(...comments.map(c => c.id)) + 1 : 1,
                reportId: state.currentReportId,
                userId: state.currentUser.id,
                userName: state.currentUser.fullName,
                content: commentText,
                timestamp: new Date().toISOString(),
                likes: 0
            };
            
            comments.unshift(newComment);
            Database.saveComments(comments);
            
            // Update report comment count
            const reportIndex = reports.findIndex(r => r.id === state.currentReportId);
            if (reportIndex !== -1) {
                reports[reportIndex].comments += 1;
                Database.saveReports(reports);
            }
            
            // Clear comment box
            document.getElementById('commentText').value = '';
            
            // Reload comments
            loadComments(state.currentReportId);
            
            showToast('Success', 'Comment added!', 'success');
        }

        function likeComment(commentId) {
            const comments = Database.getComments();
            const commentIndex = comments.findIndex(c => c.id === commentId);
            
            if (commentIndex !== -1) {
                comments[commentIndex].likes += 1;
                Database.saveComments(comments);
                loadComments(state.currentReportId);
            }
        }

        function deleteComment(commentId) {
            if (!confirm('Are you sure you want to delete this comment?')) {
                return;
            }
            
            const comments = Database.getComments();
            const comment = comments.find(c => c.id === commentId);
            
            if (!comment) return;
            
            // Remove comment
            const filteredComments = comments.filter(c => c.id !== commentId);
            Database.saveComments(filteredComments);
            
            // Update report comment count
            const reports = Database.getReports();
            const reportIndex = reports.findIndex(r => r.id === comment.reportId);
            if (reportIndex !== -1 && reports[reportIndex].comments > 0) {
                reports[reportIndex].comments -= 1;
                Database.saveReports(reports);
            }
            
            // Reload comments
            loadComments(state.currentReportId);
            
            showToast('Success', 'Comment deleted', 'success');
        }

        // ==================== USER FUNCTIONS ====================
        function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user? This action cannot be undone.')) {
                return;
            }
            
            const users = Database.getUsers();
            const filteredUsers = users.filter(u => u.id !== userId);
            
            // Also delete user's reports
            const reports = Database.getReports();
            const filteredReports = reports.filter(r => r.authorId !== userId);
            
            // Also delete user's comments
            const comments = Database.getComments();
            const filteredComments = comments.filter(c => c.userId !== userId);
            
            Database.saveUsers(filteredUsers);
            Database.saveReports(filteredReports);
            Database.saveComments(filteredComments);
            
            // If current user is deleted, log them out
            if (state.currentUser && state.currentUser.id === userId) {
                logout();
            } else {
                state.loadUsers();
            }
            
            showToast('Success', 'User deleted successfully', 'success');
        }

        // ==================== SEARCH AND FILTER FUNCTIONS ====================
        function searchReports() {
            const searchTerm = document.getElementById('reportSearch').value.toLowerCase();
            const reportCards = document.querySelectorAll('.report-card');
            
            reportCards.forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(searchTerm) ? 'block' : 'none';
            });
        }

        function filterReports() {
            const typeFilter = document.getElementById('reportTypeFilter').value;
            const statusFilter = document.getElementById('reportStatusFilter').value;
            const reportCards = document.querySelectorAll('.report-card');
            
            reportCards.forEach(card => {
                const typeBadge = card.querySelector('.report-type').textContent.toLowerCase();
                const statusBadge = card.querySelector('.badge').textContent.toLowerCase().replace(' ', '-');
                
                const typeMatch = !typeFilter || typeBadge.includes(typeFilter);
                const statusMatch = !statusFilter || statusBadge === statusFilter;
                
                card.style.display = typeMatch && statusMatch ? 'block' : 'none';
            });
        }

        // ==================== INITIALIZE APPLICATION ====================
        const state = new StateManager();

        // Initialize sample data on first run
        window.addEventListener('load', () => {
            // Force initialization of sample data
            Database.getUsers();
            Database.getReports();
            Database.getComments();
        });
    </script>
</body>
</html>
