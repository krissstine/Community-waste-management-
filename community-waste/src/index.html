<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Waste Management System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--p:#16a34a;--pl:#4ade80;--pd:#14532d;--txt:#e6edf3;--mut:#94a3b8;--card:#131c2b;--soft:#182235;--line:rgba(148,163,184,.18);--danger:#ef4444;--warn:#f59e0b;--info:#3b82f6;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:radial-gradient(circle at top,#14213a 0%,#0b1220 55%,#070b14 100%) fixed;color:var(--txt);line-height:1.6;min-height:100vh}
.container{max-width:1400px;margin:0 auto;padding:0 20px}
header{background:linear-gradient(135deg,#0f2a1a,#0b1220);border-bottom:1px solid rgba(74,222,128,.25);box-shadow:0 4px 24px rgba(0,0,0,.5);padding:1rem 0;position:sticky;top:0;z-index:1000}
.hc{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;font-size:1.7rem;font-weight:700}.logo i{color:var(--pl);font-size:2rem}
nav ul{display:flex;list-style:none;gap:8px;background:rgba(255,255,255,.06);padding:5px;border-radius:12px;flex-wrap:wrap}
nav a{color:var(--txt);text-decoration:none;padding:9px 16px;border-radius:8px;display:flex;gap:8px;align-items:center;font-weight:500;transition:.2s}
nav a:hover{background:rgba(255,255,255,.12)}nav a.on{background:var(--p);color:#fff}
.ui{display:flex;align-items:center;gap:12px}
.ub{background:rgba(255,255,255,.08);padding:6px 14px;border-radius:25px;display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
main{padding:30px 0;min-height:calc(100vh - 120px)}
.ch{margin-bottom:28px}.ch h1{font-size:2rem;display:flex;gap:10px;align-items:center}.ch p{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:25px;margin-bottom:25px;box-shadow:0 8px 32px rgba(0,0,0,.45)}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:1.4rem;display:flex;gap:10px;align-items:center}
.fg{margin-bottom:18px}.fg label{display:block;margin-bottom:7px;font-weight:600;font-size:.95rem}
.fc{width:100%;padding:12px 16px;border:2px solid #26344a;border-radius:10px;font:inherit;background:#0e1624;color:var(--txt);transition:.2s}
.fc::placeholder{color:#64748b}.fc:focus{outline:none;border-color:var(--pl);box-shadow:0 0 0 3px rgba(74,222,128,.18)}
select.fc option{background:#0e1624;color:var(--txt)}
.btn{padding:11px 22px;border:none;border-radius:10px;cursor:pointer;font:600 15px inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#223046;color:var(--txt);transition:.2s}
.btn:hover{transform:translateY(-2px)}
.b1{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff}.b1:hover{box-shadow:0 6px 20px rgba(34,197,94,.35)}
.b2{background:transparent;border:2px solid var(--pl);color:var(--pl)}.b2:hover{background:var(--pl);color:#0b1220}
.bi{background:#2563eb;color:#fff}.bw{background:#d97706;color:#fff}.bd{background:#dc2626;color:#fff}.bs{background:#16a34a;color:#fff}
.sm{padding:7px 13px;font-size:14px;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;margin-bottom:28px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;position:relative;overflow:hidden;transition:.3s}
.stat:before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--p),var(--pl))}
.stat:hover,.rc:hover{transform:translateY(-4px);border-color:rgba(74,222,128,.4)}
.stat i{font-size:2.6rem;color:var(--pl)}.stat b{display:block;font-size:2.4rem;margin:6px 0}.stat span{color:var(--mut)}
.rc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.3s;cursor:pointer;display:flex;flex-direction:column}
.rh{padding:13px 15px;background:var(--soft);display:flex;justify-content:space-between;align-items:center}
.rb{padding:15px;flex:1}.rb h3{font-size:1.15rem;margin-bottom:8px}.rb p{color:#b6c2d1;font-size:.95rem}
.loc{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:.9rem;margin-top:10px}
.rf{padding:12px 15px;background:#101826;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.au{display:flex;align-items:center;gap:8px;font-size:.85rem}.au .av{width:30px;height:30px;font-size:.8rem}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:5px 12px;border-radius:20px;font-size:.78rem;font-weight:600;color:#fff;text-transform:uppercase;letter-spacing:.4px;display:inline-block}
.t-recyclable{background:#16a34a}.t-hazardous{background:#dc2626}.t-organic{background:#65a30d}.t-electronic{background:#2563eb}.t-general{background:#d97706}
.s-pending{background:#ffd166;color:#5c4200}.s-in-progress{background:#0891b2}.s-resolved{background:#16a34a}
.p-low{background:#475569}.p-medium{background:#2563eb}.p-high{background:#d97706}.p-critical{background:#dc2626}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse}th{background:var(--soft);padding:14px;text-align:left}td{padding:14px;border-bottom:1px solid #1f2b3f}tr:hover td{background:#172134}
.modal{display:none;position:fixed;inset:0;background:rgba(2,6,14,.78);z-index:2000;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
.mc{background:var(--card);border:1px solid var(--line);border-radius:20px;width:92%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 50px rgba(0,0,0,.6)}
.mh{padding:20px 26px;background:var(--soft);border-radius:20px 20px 0 0;display:flex;justify-content:space-between;align-items:center}
.mh h3{font-size:1.3rem}.mh button{background:none;border:none;color:var(--mut);font-size:1.6rem;cursor:pointer}.mh button:hover{color:var(--danger)}
.mbody{padding:26px}.mf{padding:16px 26px;background:var(--soft);border-radius:0 0 20px 20px;display:flex;justify-content:flex-end;gap:10px}
.cm{background:#0e1624;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.cm-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.auth{max-width:440px;margin:50px auto}.auth .card{padding:42px}.auth h2{text-align:center;font-size:2rem}.auth .sub{text-align:center;color:var(--mut);margin-bottom:30px}
.auth .foot{text-align:center;margin-top:24px;padding-top:20px;border-top:1px solid var(--line);color:var(--mut)}
a{color:var(--pl);font-weight:600;text-decoration:none}a:hover{text-decoration:underline}
.sf{display:flex;gap:14px;margin-bottom:24px;flex-wrap:wrap}.sf .fc{flex:1;min-width:180px}
.empty{text-align:center;padding:50px 20px;color:var(--mut)}.empty i{font-size:3.5rem;opacity:.5;margin-bottom:14px}
.box{background:var(--soft);padding:16px;border-radius:12px;margin-bottom:14px}.box h5{color:var(--mut);margin-bottom:6px}
.toast{position:fixed;bottom:28px;right:28px;background:var(--soft);border:1px solid var(--line);padding:16px 22px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.6);display:none;align-items:center;gap:14px;z-index:3000;max-width:380px;border-left:5px solid var(--p)}
.toast.err{border-left-color:var(--danger)}.toast i{font-size:1.5rem;color:var(--pl)}.toast.err i{color:var(--danger)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#0b1220}::-webkit-scrollbar-thumb{background:#26344a;border-radius:8px}
@media(max-width:600px){.rgrid{grid-template-columns:1fr}.auth .card{padding:26px}}
</style>
</head>
<body>
<header><div class="container hc">
<div class="logo"><i class="fas fa-recycle"></i><span>CommunityCleanUp</span></div>
<nav id="nav"></nav><div class="ui" id="ui"></div>
</div></header>
<main><div class="container" id="content"></div></main>

<div id="reportModal" class="modal"><div class="mc">
<div class="mh"><h3><i class="fas fa-plus-circle"></i> Report Waste Issue</h3><button onclick="closeModal()">&times;</button></div>
<div class="mbody"><form onsubmit="event.preventDefault();submitReport()" oninput="saveDraft()" id="reportForm">
<div class="fg"><label>Issue Title</label><input id="rTitle" class="fc" placeholder="e.g., Overflowing bins on Main Street" required></div>
<div class="fg"><label>Waste Type</label><select id="rType" class="fc" required><option value="">Select waste type</option><option value="recyclable">Recyclable (plastic, paper, glass)</option><option value="hazardous">Hazardous (chemicals, batteries)</option><option value="organic">Organic (food, garden waste)</option><option value="electronic">Electronic Waste</option><option value="general">General Waste</option></select></div>
<div class="fg"><label>Location</label><input id="rLoc" class="fc" placeholder="e.g., Near Central Park" required></div>
<div class="fg"><label>Description</label><textarea id="rDesc" class="fc" rows="4" placeholder="Details about the waste issue..." required></textarea></div>
<div class="fg"><label><i class="fas fa-camera"></i> Photo (optional)</label><input id="rPhoto" type="file" accept="image/*" class="fc" onchange="pickPhoto(this)"><img id="rPrev" alt="Preview" style="display:none;max-width:100%;max-height:200px;border-radius:10px;margin-top:10px"></div>
<div class="fg"><label>Priority</label><select id="rPri" class="fc"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="critical">Critical</option></select></div>
<div style="display:flex;justify-content:flex-end;gap:10px"><button type="button" class="btn b2" onclick="closeModal()">Cancel</button><button class="btn b1"><i class="fas fa-paper-plane"></i> Submit Report</button></div>
</form></div></div></div>

<div id="commentModal" class="modal"><div class="mc">
<div class="mh"><h3><i class="fas fa-comments"></i> Comments</h3><button onclick="closeModal()">&times;</button></div>
<div class="mbody"><textarea id="cText" class="fc" rows="3" placeholder="Add your comment..." oninput="S('cwm_cdraft',{id:rid,t:this.value})"></textarea>
<button class="btn b1" style="margin-top:10px" onclick="addComment()"><i class="fas fa-paper-plane"></i> Post Comment</button>
<div id="cList"></div></div>
<div class="mf"><button class="btn b2" onclick="closeModal()">Close</button></div></div></div>

<div id="detailModal" class="modal"><div class="mc">
<div class="mh"><h3><i class="fas fa-file-alt"></i> Report Details</h3><button onclick="closeModal()">&times;</button></div>
<div class="mbody" id="detail"></div>
<div class="mf"><button class="btn b2" onclick="closeModal()">Close</button><button class="btn b1" onclick="openComments()"><i class="fas fa-comment"></i> View Comments</button></div></div></div>

<div id="toast" class="toast"><i class="fas fa-check-circle"></i><div><strong id="tT"></strong><div id="tM"></div></div></div>

<script>
const $=id=>document.getElementById(id);
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toISOString();
const COLORS=['#1a5fb4','#26a269','#e5a50a','#c01c28','#9141ac','#1c71d8'];

function users(){let u=L('cwm_users',[]);if(!u.length){u=[
{id:1,fullName:'Admin User',email:'admin@cwm.com',password:'123456',role:'admin',avatarColor:'#1a5fb4',joinDate:now()},
{id:2,fullName:'John Resident',email:'john@example.com',password:'123456',role:'resident',avatarColor:'#26a269',joinDate:now()},
{id:3,fullName:'Sarah Staff',email:'sarah@example.com',password:'123456',role:'staff',avatarColor:'#e5a50a',joinDate:now()}];S('cwm_users',u)}return u}
function reports(){let r=L('cwm_reports',[]);if(!r.length){r=[
{id:1,title:'Overflowing Recycling Bins at Central Park',description:'The recycling bins near the playground have been overflowing for two days. Need urgent attention.',type:'recyclable',location:'Central Park, Downtown',authorId:2,authorName:'John Resident',status:'pending',priority:'high',date:'2026-10-15',upvotes:12,comments:2},
{id:2,title:'Illegal Dumping of Construction Waste',description:'Someone dumped construction materials in the alley behind 5th Street. Includes hazardous materials.',type:'hazardous',location:'Alley behind 5th Street',authorId:2,authorName:'John Resident',status:'in-progress',priority:'critical',date:'2026-10-14',upvotes:8,comments:1},
{id:3,title:'Food Waste Accumulation Near Market',description:'Organic waste from the market is piling up and attracting pests. Needs proper composting setup.',type:'organic',location:'Farmers Market Area',authorId:2,authorName:'John Resident',status:'resolved',priority:'medium',date:'2026-10-13',upvotes:15,comments:0}];S('cwm_reports',r)}return r}
function comments(){let c=L('cwm_comments',null);if(!c){c=[
{id:1,reportId:1,userId:2,userName:'John Resident',content:'This has been here for days! I reported it yesterday too.',timestamp:'2026-10-15T14:30:00',likes:3},
{id:2,reportId:1,userId:3,userName:'Sarah Staff',content:"I'll contact the local authorities about this.",timestamp:'2026-10-15T15:30:00',likes:1},
{id:3,reportId:2,userId:1,userName:'Admin User',content:'Assigned to cleanup crew. Will be resolved within 24 hours.',timestamp:'2026-10-14T10:15:00',likes:5}];S('cwm_comments',c)}return c}

let cur=L('cwm_currentUser',null),rid=null,page='dash';
const isStaff=()=>cur&&(cur.role==='admin'||cur.role==='staff');
const canSee=r=>r.photo&&(isStaff()||r.authorId===cur.id);
const cc=id=>comments().filter(c=>c.reportId===id).length;
const colorOf=id=>(users().find(u=>u.id===id)||{}).avatarColor||'#64748b';

function toast(t,m,err){const e=$('toast');$('tT').textContent=t;$('tM').textContent=m;e.className='toast'+(err?' err':'');e.querySelector('i').className=err?'fas fa-exclamation-circle':'fas fa-check-circle';e.style.display='flex';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}
function closeModal(){document.querySelectorAll('.modal').forEach(m=>m.style.display='none')}
let photoData='';
function pickPhoto(inp){const f=inp.files[0];photoData='';$('rPrev').style.display='none';if(!f)return;if(!f.type.startsWith('image/')){inp.value='';return toast('Error','Please choose an image file',1)}
 const img=new Image(),rd=new FileReader();rd.onload=()=>{img.onload=()=>{const k=Math.min(1,800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.7);$('rPrev').src=photoData;$('rPrev').style.display='block'};img.onerror=()=>toast('Error','Could not read that image',1);img.src=rd.result};rd.readAsDataURL(f)}
function saveDraft(){S('cwm_draft',{t:$('rTitle').value,ty:$('rType').value,lo:$('rLoc').value,d:$('rDesc').value,pr:$('rPri').value})}
function openReportModal(){const d=L('cwm_draft',null);if(d){$('rTitle').value=d.t||'';$('rType').value=d.ty||'';$('rLoc').value=d.lo||'';$('rDesc').value=d.d||'';$('rPri').value=d.pr||'medium'}$('reportModal').style.display='flex'}

function header(){
 if(!cur){$('nav').innerHTML='';$('ui').innerHTML='';return}
 const a=(p,fn,ic,t)=>`<li><a href="#" class="${page===p?'on':''}" onclick="event.preventDefault();${fn}"><i class="fas fa-${ic}"></i> ${t}</a></li>`;
 $('nav').innerHTML='<ul>'+a('dash','go(\'dash\')','home','Dashboard')+
  (cur.role==='resident'?a('new','openReportModal()','plus-circle','New Report')+a('mine','go(\'mine\')','file-alt','My Reports'):'')+
  (isStaff()?a('all','go(\'all\')','list','All Reports'):'')+(cur.role==='admin'?a('users','go(\'users\')','users','Users'):'')+'</ul>';
 $('ui').innerHTML=`<div class="ub"><div class="av" style="background:${cur.avatarColor}">${esc(cur.fullName[0])}</div><div><div style="font-weight:600">${esc(cur.fullName)}</div><div style="font-size:.8rem;color:var(--mut)">${cur.role}</div></div></div><button class="btn bd sm" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>`}

function go(p){page=p;S('cwm_page',p);header();({dash:dash,all:allReports,mine:myReports,users:userList})[p]()}
function boot(){header();if(!cur)return authPage();const sp=L('cwm_page','dash');go((sp==='all'&&isStaff())||(sp==='users'&&cur.role==='admin')||(sp==='mine'&&cur.role==='resident')?sp:'dash')}

function authPage(){$('content').innerHTML=`<div class="auth">
<div class="card" id="loginCard"><h2>Welcome Back</h2><p class="sub">Sign in to your account</p>
<form onsubmit="event.preventDefault();login()">
<div class="fg"><label><i class="fas fa-envelope"></i> Email Address</label><input id="email" type="email" class="fc" placeholder="Enter your email" required></div>
<div class="fg"><label><i class="fas fa-lock"></i> Password</label><input id="password" type="password" class="fc" placeholder="Enter your password" required></div>
<button class="btn b1" style="width:100%"><i class="fas fa-sign-in-alt"></i> Sign In</button></form>
<div class="foot">Don't have an account? <a href="#" onclick="event.preventDefault();authSwitch(true)">Register here</a></div></div>
<div class="card" id="regCard" style="display:none"><h2>Create Account</h2><p class="sub">Join our community</p>
<form onsubmit="event.preventDefault();register()">
<div class="fg"><label><i class="fas fa-user"></i> Full Name</label><input id="regName" class="fc" placeholder="Enter your full name" required></div>
<div class="fg"><label><i class="fas fa-envelope"></i> Email Address</label><input id="regEmail" type="email" class="fc" placeholder="Enter your email" required></div>
<div class="fg"><label><i class="fas fa-lock"></i> Password</label><input id="regPass" type="password" class="fc" placeholder="Create a password (min 6 characters)" required></div>
<div class="fg"><label><i class="fas fa-user-tag"></i> Account Type</label><select id="regRole" class="fc"><option value="resident">Resident</option><option value="staff">Staff Member</option></select></div>
<button class="btn b1" style="width:100%"><i class="fas fa-user-plus"></i> Create Account</button></form>
<div class="foot">Already have an account? <a href="#" onclick="event.preventDefault();authSwitch(false)">Sign in here</a></div></div></div>`}
function authSwitch(reg){$('loginCard').style.display=reg?'none':'block';$('regCard').style.display=reg?'block':'none'}

function login(){const e=$('email').value.trim().toLowerCase(),p=$('password').value;
 const u=users().find(x=>x.email.toLowerCase()===e&&x.password===p);
 if(!u)return toast('Error','Invalid email or password',1);
 const {password,...safe}=u;cur=safe;S('cwm_currentUser',cur);boot();toast('Success','Login successful!')}
function register(){const name=$('regName').value.trim(),email=$('regEmail').value.trim(),pass=$('regPass').value;
 const role=$('regRole').value==='staff'?'staff':'resident'; // admin cannot be self-registered
 if(!name||!email||!pass)return toast('Error','Please fill in all fields',1);
 if(pass.length<6)return toast('Error','Password must be at least 6 characters',1);
 const u=users();if(u.some(x=>x.email.toLowerCase()===email.toLowerCase()))return toast('Error','Email already registered',1);
 const n={id:Math.max(0,...u.map(x=>x.id))+1,fullName:name,email,password:pass,role,avatarColor:COLORS[Math.floor(Math.random()*COLORS.length)],joinDate:now()};
 u.push(n);S('cwm_users',u);const {password,...safe}=n;cur=safe;S('cwm_currentUser',cur);boot();toast('Success','Registration successful!')}
function logout(){localStorage.removeItem('cwm_currentUser');localStorage.removeItem('cwm_page');cur=null;boot();toast('Success','Logged out successfully')}

function card(r,full){
 const pr=`<span class="tag p-${r.priority}">${r.priority}</span>`;
 return `<div class="rc" data-type="${r.type}" data-status="${r.status}" data-text="${esc((r.title+' '+r.description+' '+r.location+' '+r.authorName).toLowerCase())}" onclick="viewReport(${r.id})">
<div class="rh"><span class="tag t-${r.type}">${r.type}</span><span class="tag s-${r.status}">${r.status}</span></div>
${canSee(r)?`<img src="${esc(r.photo)}" alt="Report photo" style="width:100%;height:170px;object-fit:cover;display:block">`:''}<div class="rb"><h3>${esc(r.title)}</h3><p>${esc(full?r.description:r.description.slice(0,110)+(r.description.length>110?'...':''))}</p>
<div class="loc"><i class="fas fa-map-marker-alt"></i><span>${esc(r.location)}</span></div>
<div class="loc">${pr}<span><i class="fas fa-calendar"></i> ${esc(r.date)}</span></div></div>
<div class="rf"><div class="au"><div class="av" style="background:${colorOf(r.authorId)}">${esc(r.authorName[0])}</div><div><strong>${esc(r.authorName)}</strong></div></div>
<div class="acts" onclick="event.stopPropagation()">
<button class="btn sm" onclick="upvote(${r.id})"><i class="fas fa-thumbs-up"></i> ${r.upvotes}</button>
<button class="btn sm bs" onclick="openComments(${r.id})"><i class="fas fa-comment"></i> ${cc(r.id)}</button>
${isStaff()&&r.status==='pending'?`<button class="btn sm bw" title="Start working" onclick="setStatus(${r.id},'in-progress')"><i class="fas fa-play"></i></button>`:''}
${isStaff()&&r.status==='in-progress'?`<button class="btn sm bs" title="Mark resolved" onclick="setStatus(${r.id},'resolved')"><i class="fas fa-check"></i></button>`:''}
${cur.role==='admin'?`<button class="btn sm bd" title="Delete" onclick="delReport(${r.id})"><i class="fas fa-trash"></i></button>`:''}
</div></div></div>`}

function dash(){const r=reports(),c=s=>r.filter(x=>x.status===s).length;
 $('content').innerHTML=`<div class="ch"><h1><i class="fas fa-tachometer-alt"></i> Dashboard Overview</h1><p>Welcome back, ${esc(cur.fullName)}! Here's what's happening in your community.</p></div>
<div class="grid">
<div class="stat"><i class="fas fa-flag"></i><b>${r.length}</b><span>Total Reports</span></div>
<div class="stat"><i class="fas fa-clock"></i><b>${c('pending')}</b><span>Pending</span></div>
<div class="stat"><i class="fas fa-spinner"></i><b>${c('in-progress')}</b><span>In Progress</span></div>
<div class="stat"><i class="fas fa-check-circle"></i><b>${c('resolved')}</b><span>Resolved</span></div></div>
<div class="card"><div class="card-h"><h2><i class="fas fa-history"></i> Recent Reports</h2>${isStaff()?`<button class="btn b1" onclick="go('all')"><i class="fas fa-eye"></i> View All</button>`:cur.role==='resident'?`<button class="btn b1" onclick="openReportModal()"><i class="fas fa-plus"></i> New Report</button>`:''}</div>
<div class="rgrid">${r.slice(0,4).map(x=>card(x)).join('')||'<div class="empty">No reports yet</div>'}</div></div>
${cur.role==='admin'?`<div class="card"><div class="card-h"><h2><i class="fas fa-chart-bar"></i> Community Statistics</h2></div><div class="grid" style="margin:0">
<div class="stat"><b>${users().length}</b><span>Total Users</span></div><div class="stat"><b>${c('resolved')}</b><span>Issues Resolved</span></div><div class="stat"><b>${c('pending')}</b><span>Active Issues</span></div></div></div>`:''}`}

function allReports(){if(!isStaff())return go('dash');
 $('content').innerHTML=`<div class="ch"><h1><i class="fas fa-list"></i> All Community Reports</h1><p>Browse and manage waste reports from the community</p></div>
<div class="sf"><input id="q" class="fc" placeholder="Search reports..." oninput="filt()" style="flex:2">
<select id="ft" class="fc" onchange="filt()"><option value="">All Types</option><option value="recyclable">Recyclable</option><option value="hazardous">Hazardous</option><option value="organic">Organic</option><option value="electronic">Electronic</option><option value="general">General</option></select>
<select id="fs" class="fc" onchange="filt()"><option value="">All Status</option><option value="pending">Pending</option><option value="in-progress">In Progress</option><option value="resolved">Resolved</option></select></div>
<div class="rgrid">${reports().map(x=>card(x,1)).join('')}</div>`;const f=L('cwm_filters',{});$('q').value=f.q||'';$('ft').value=f.t||'';$('fs').value=f.s||'';filt()}
function filt(){const q=$('q').value.toLowerCase(),t=$('ft').value,s=$('fs').value;S('cwm_filters',{q:$('q').value,t,s});
 document.querySelectorAll('.rc').forEach(c=>c.style.display=(!q||c.dataset.text.includes(q))&&(!t||c.dataset.type===t)&&(!s||c.dataset.status===s)?'':'none')}

function myReports(){const r=reports().filter(x=>x.authorId===cur.id);
 $('content').innerHTML=`<div class="ch"><h1><i class="fas fa-file-alt"></i> My Reports</h1><p>View and manage your submitted waste reports</p></div>`+
 (r.length?`<div class="rgrid">${r.map(x=>card(x,1)).join('')}</div>`:`<div class="card"><div class="empty"><i class="fas fa-inbox"></i><h3>No Reports Yet</h3><p>You haven't submitted any waste reports yet.</p><button class="btn b1" style="margin-top:18px" onclick="openReportModal()"><i class="fas fa-plus"></i> Submit Your First Report</button></div></div>`)}

function userList(){if(cur.role!=='admin')return go('dash');const u=users(),rc={admin:'#c01c28',staff:'#1a5fb4',resident:'#26a269'};
 $('content').innerHTML=`<div class="ch"><h1><i class="fas fa-users"></i> User Management</h1><p>Manage system users</p></div>
<div class="card"><div class="card-h"><h2><i class="fas fa-user-friends"></i> All Users</h2><span style="color:var(--mut)">${u.length} users</span></div>
<div class="tw"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Actions</th></tr></thead><tbody>
${u.map(x=>`<tr><td>${x.id}</td><td><div style="display:flex;align-items:center;gap:10px"><div class="av" style="background:${x.avatarColor}">${esc(x.fullName[0])}</div>${esc(x.fullName)}</div></td><td>${esc(x.email)}</td><td><span class="tag" style="background:${rc[x.role]||'#64748b'}">${x.role}</span></td><td>${new Date(x.joinDate).toLocaleDateString()}</td><td>${x.id!==cur.id?`<button class="btn sm bd" onclick="delUser(${x.id})"><i class="fas fa-trash"></i> Delete</button>`:'<span style="color:var(--mut)">Current User</span>'}</td></tr>`).join('')}
</tbody></table></div></div>`}

function refresh(){go(page)}
function submitReport(){const t=$('rTitle').value.trim(),ty=$('rType').value,lo=$('rLoc').value.trim(),d=$('rDesc').value.trim();
 if(!t||!ty||!lo||!d)return toast('Error','Please fill in all required fields',1);
 const r=reports();r.unshift({id:Math.max(0,...r.map(x=>x.id))+1,title:t,description:d,type:ty,location:lo,authorId:cur.id,authorName:cur.fullName,status:'pending',priority:$('rPri').value,date:new Date().toISOString().slice(0,10),upvotes:0,comments:0,photo:photoData});
 if(!S('cwm_reports',r))return toast('Error','Storage is full. Try a smaller photo.',1);localStorage.removeItem('cwm_draft');$('reportForm').reset();photoData='';$('rPrev').style.display='none';closeModal();go('dash');toast('Success','Report submitted successfully!')}
function upvote(id){const r=reports(),x=r.find(y=>y.id===id);if(!x)return;x.upvotes++;S('cwm_reports',r);refresh();toast('Success','Report upvoted!')}
function setStatus(id,s){if(!isStaff()||!confirm(`Change this report status to "${s}"?`))return;const r=reports(),x=r.find(y=>y.id===id);if(!x)return;x.status=s;S('cwm_reports',r);refresh();toast('Success','Report marked as '+s)}
function delReport(id){if(cur.role!=='admin'||!confirm('Delete this report?'))return;S('cwm_reports',reports().filter(x=>x.id!==id));S('cwm_comments',comments().filter(c=>c.reportId!==id));refresh();toast('Success','Report deleted')}
function delUser(id){if(cur.role!=='admin'||id===cur.id||!confirm('Delete this user and their reports and comments? This cannot be undone.'))return;
 S('cwm_users',users().filter(u=>u.id!==id));S('cwm_reports',reports().filter(r=>r.authorId!==id));S('cwm_comments',comments().filter(c=>c.userId!==id));refresh();toast('Success','User deleted')}

function viewReport(id){const r=reports().find(x=>x.id===id);if(!r)return toast('Error','Report not found',1);rid=id;
 $('detail').innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><span class="tag t-${r.type}">${r.type}</span><span class="tag s-${r.status}">${r.status}</span><span class="tag p-${r.priority}">${r.priority}</span></div>
<h3 style="margin-bottom:14px">${esc(r.title)}</h3>
${canSee(r)?`<img src="${esc(r.photo)}" alt="Report photo" style="width:100%;max-height:320px;object-fit:contain;background:#0e1624;border-radius:12px;margin-bottom:14px">`:''}
<div class="box"><h5><i class="fas fa-map-marker-alt"></i> Location</h5>${esc(r.location)}</div>
<div class="box"><h5><i class="fas fa-file-alt"></i> Description</h5>${esc(r.description)}</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div class="box"><h5><i class="fas fa-user"></i> Reported By</h5><b>${esc(r.authorName)}</b></div><div class="box"><h5><i class="fas fa-calendar"></i> Date</h5><b>${esc(r.date)}</b></div>
<div class="box" style="text-align:center"><b style="font-size:1.5rem;color:var(--pl)">${r.upvotes}</b><div style="color:var(--mut)">Upvotes</div></div><div class="box" style="text-align:center"><b style="font-size:1.5rem;color:var(--info)">${cc(r.id)}</b><div style="color:var(--mut)">Comments</div></div></div>`;
 $('detailModal').style.display='flex'}

function openComments(id){if(id)rid=id;if(!rid)return;loadComments();const cd=L('cwm_cdraft',{});$('cText').value=cd.id===rid?cd.t:'';closeModal();$('commentModal').style.display='flex'}
function loadComments(){const c=comments().filter(x=>x.reportId===rid).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
 $('cList').innerHTML=c.length?c.map(x=>`<div class="cm"><div class="cm-h"><div class="au"><div class="av" style="background:${colorOf(x.userId)};width:30px;height:30px">${esc(x.userName[0])}</div><div><strong>${esc(x.userName)}</strong><div style="font-size:.78rem;color:var(--mut)">${new Date(x.timestamp).toLocaleString()}</div></div></div>
<div class="acts"><button class="btn sm" onclick="likeComment(${x.id})"><i class="fas fa-thumbs-up"></i> ${x.likes}</button>${x.userId===cur.id||cur.role==='admin'?`<button class="btn sm bd" onclick="delComment(${x.id})"><i class="fas fa-trash"></i></button>`:''}</div></div>${esc(x.content)}</div>`).join(''):'<div class="empty"><i class="fas fa-comment-slash"></i><h4>No comments yet</h4><p>Be the first to comment</p></div>'}
function addComment(){const t=$('cText').value.trim();if(!t)return toast('Error','Please enter a comment',1);
 const c=comments();c.unshift({id:Math.max(0,...c.map(x=>x.id))+1,reportId:rid,userId:cur.id,userName:cur.fullName,content:t,timestamp:now(),likes:0});S('cwm_comments',c);
 const r=reports(),x=r.find(y=>y.id===rid);if(x){x.comments++;S('cwm_reports',r)}$('cText').value='';localStorage.removeItem('cwm_cdraft');loadComments();refresh();toast('Success','Comment added!')}
function likeComment(id){const c=comments(),x=c.find(y=>y.id===id);if(x){x.likes++;S('cwm_comments',c);loadComments()}}
function delComment(id){if(!confirm('Delete this comment?'))return;const c=comments(),x=c.find(y=>y.id===id);if(!x)return;S('cwm_comments',c.filter(y=>y.id!==id));
 const r=reports(),p=r.find(y=>y.id===x.reportId);if(p&&p.comments>0){p.comments--;S('cwm_reports',r)}loadComments();refresh();toast('Success','Comment deleted')}
document.addEventListener('click',e=>{if(e.target.classList.contains('modal'))closeModal()});
boot();
if (location.hash === '#register' && !cur) authSwitch(true);
</script>
</body>
</html>
